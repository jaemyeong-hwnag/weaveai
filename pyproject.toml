[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "creativity-engine"
version = "0.1.0"
description = "도메인 무관 창의적 문제해결 AI 에이전트 프레임워크"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "langgraph>=0.2.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "llama-index-core>=0.11.0",
    "llama-index-readers-web>=0.2.0",
    "tavily-python>=0.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]
openai = [
    "openai>=1.0.0",
]
gemini = [
    "google-genai>=1.0.0",
]
ollama = [
    "ollama>=0.3.0",
]
all = [
    "openai>=1.0.0",
    "google-genai>=1.0.0",
    "ollama>=0.3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
